# ShipNotes public demo. Rate limits protect the single CPU core.
limit_req_zone $binary_remote_addr zone=shipnotes_api:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=shipnotes_web:10m rate=10r/s;

server {
    listen 80;
    server_name shipnotes.example.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name shipnotes.example.com;
    ssl_certificate     /etc/letsencrypt/live/shipnotes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shipnotes.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    limit_req_status 429;
    access_log off;

    location = /api/notes {
        limit_req zone=shipnotes_api burst=3 nodelay;
        proxy_pass http://127.0.0.1:8411;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # stream notes line by line
        proxy_read_timeout 300s;
    }
    location / {
        limit_req zone=shipnotes_web burst=20 nodelay;
        proxy_pass http://127.0.0.1:8411;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
